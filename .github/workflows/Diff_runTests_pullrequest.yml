name: PullRequest - Diff to Ancestor, Publish and attach Report

on:
  pull_request:
    branches: [ main ]

jobs:
  my-job:
    name: Diff to Ancestor, Publish and attach Report
    runs-on: ubuntu-latest

    # Force all JavaScript actions to run on Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5          # Node 24 native new
        with:
          fetch-depth: 0

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023a
          products: Simulink Simulink_Test

      - name: Compare Models to Ancestors
        uses: matlab-actions/run-command@v2.1.1
        with:
          command: branch = "${{ github.head_ref }}"; diffGitHub_pullrequest(branch);

      - name: Debug — list generated report files
        if: always()
        run: |
          echo "=== HTML files ==="
          find ${{ github.workspace }} -name "*.html" 2>/dev/null \
            || echo "none"
          echo "=== PDF files ==="
          find ${{ github.workspace }} -name "*.pdf" 2>/dev/null \
            || echo "none"

      - name: Upload Comparison Reports
        if: always()
        uses: actions/upload-artifact@v6   # Node 24 native
        with:
          name: diffreports
          path: |
            ${{ github.workspace }}/**/*.html
            ${{ github.workspace }}/**/*.pdf
            ${{ github.workspace }}/**/*.png
          if-no-files-found: warn
